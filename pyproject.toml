[project]
name = "coolfrog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "cooldata",
  "h5py>=3.16.0",
  "hdf5plugin>=7.1.0",
  "polars>=2.0.0",
  "pyyaml>=6",
  "rich>=15.0.0",
  "tadpole",
  "tensordict>=0.14",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "ipykernel>=7.4.0",
  "jupyterlab>=4",
  "jupytext>=1.19.6",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.12.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "coolfrog"
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--import-mode=importlib",
]

[tool.ruff]
target-version = "py312"
line-length = 135

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "C4",  # comprehensions
  "UP",  # modern python standards
  "PERF", # Performance suggestions
  "PL",  # Pylint
  "PT",  # Pytest style
  "PTH", # Pathlib
  "SIM", # simplify
  "ANN", # type hints
  "ARG", # unused arguments
  "RUF"  # Ruff-native rules
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401", "PLR2004"]

# Enables Ruff formatter with default options (Black-compatible)
[tool.ruff.format]

[tool.uv.sources]
tadpole = { git = "https://github.com/tum-pbs/Tadpole" }
cooldata = { git = "https://github.com/peteole/flow_field_dataset" }
