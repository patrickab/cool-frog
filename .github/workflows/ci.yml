name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run, so repeated pushes
# don't burn minutes on results nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"   # fail if uv.lock is out of sync with pyproject.toml

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --group dev

      # --output-format=github renders findings as inline annotations on the diff
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
